name: AMSN Segev Matched-Support Passive Admittance Operator Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/amsn-segev-passive-admittance-operator.yml"
      - "amsn-core/examples/human_segev_membrane_area_support_audit.py"
      - "amsn-core/examples/human_full_tree_axial_matrix_audit.py"
      - "amsn-core/examples/human_full_tree_axial_network_audit.py"
      - "amsn-core/examples/human_segev_passive_admittance_operator_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/**"
      - "amsn-core/data/human/segev/**"
      - "amsn-core/pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/amsn-segev-passive-admittance-operator.yml"
      - "amsn-core/examples/human_segev_membrane_area_support_audit.py"
      - "amsn-core/examples/human_full_tree_axial_matrix_audit.py"
      - "amsn-core/examples/human_full_tree_axial_network_audit.py"
      - "amsn-core/examples/human_segev_passive_admittance_operator_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/**"
      - "amsn-core/data/human/segev/**"
      - "amsn-core/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passive-admittance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - morphology_label: NMO_68174_cell1125
            morphology_path: data/human/segev/2013_03_06_cell11_1125_H41_06.CNG.swc
          - morphology_label: NMO_68175_cell1204
            morphology_path: data/human/segev/2013_03_13_cell03_1204_H42_02.CNG.swc
    env:
      AMSN_MORPHOLOGY_LABEL: ${{ matrix.morphology_label }}
      AMSN_MORPHOLOGY_PATH: ${{ matrix.morphology_path }}
      AMSN_NEURON_MAX_SEGMENT_UM: "0.125"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Run complete AMSN test suite
        run: python -m pytest
        working-directory: amsn-core
      - name: Verify NEURON and morphology source
        run: |
          python -c "import neuron; print('NEURON', neuron.__version__)"
          test -s "${{ matrix.morphology_path }}"
        working-directory: amsn-core
      - name: Build matched membrane-area control volumes
        run: python examples/human_segev_membrane_area_support_audit.py
        working-directory: amsn-core
      - name: Build matched axial conductance matrix
        run: python examples/human_full_tree_axial_matrix_audit.py
        working-directory: amsn-core
      - name: Compare matched-support passive admittance operators
        shell: bash
        run: |
          set -o pipefail
          python examples/human_segev_passive_admittance_operator_audit.py | tee "${{ matrix.morphology_label }}-passive-admittance-operator.log"
        working-directory: amsn-core
      - name: Preserve passive operator measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-${{ matrix.morphology_label }}-passive-admittance-operator-0.125um
          path: |
            amsn-core/${{ matrix.morphology_label }}-passive-admittance-operator.log
            amsn-core/results/${{ matrix.morphology_label }}_human_membrane_area_control_volumes_2026-11-21.csv
            amsn-core/results/${{ matrix.morphology_label }}_human_full_tree_axial_matrix_edges_2026-11-21.csv
            amsn-core/results/${{ matrix.morphology_label }}_human_full_tree_passive_admittance_operator_2026-11-21.csv
          if-no-files-found: error
