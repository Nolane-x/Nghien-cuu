name: AMSN Wilbers original AP-clamp trace replay

on:
  push:
    branches:
      - research/wilbers-human-active-channel-baseline-2026-11-22
    paths:
      - "amsn-core/examples/replay_wilbers_apclamp.py"
      - "amsn-core/tests/test_wilbers_apclamp_replay.py"
      - ".github/workflows/amsn-wilbers-apclamp-replay.yml"
      - "amsn-core/research/references/wilbers2023_dataverse_source_manifest_2026-11-22.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amsn-wilbers-apclamp-replay
  cancel-in-progress: false

jobs:
  original-apclamp-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NEURON and original AP-clamp helper dependencies
        working-directory: amsn-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" neuron==9.0.2 scipy==1.15.3 pandas==2.2.3 matplotlib==3.10.1 seaborn==0.13.2
      - name: Test source protocol slice and LJP invariants
        working-directory: amsn-core
        run: python -m pytest -q tests/test_wilbers_apclamp_replay.py
      - name: Download, checksum and replay the original five-AP protocol
        working-directory: amsn-core
        env:
          MPLBACKEND: Agg
        run: python examples/replay_wilbers_apclamp.py --output artifacts/wilbers-apclamp-replay.json
      - name: Upload raw trace integrity and model replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilbers-original-apclamp-trace-replay
          path: amsn-core/artifacts/wilbers-apclamp-replay.json
          if-no-files-found: warn
          retention-days: 30
