name: AMSN Human Passive PRIMA Nine-Port High-Order Basis Capacity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/amsn-human-prima-nine-port-high-order.yml"
      - "amsn-core/src/amsn/reduction.py"
      - "amsn-core/src/amsn/prima.py"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/morphology.py"
      - "amsn-core/src/amsn/ports.py"
      - "amsn-core/examples/human_schur_port_matrix_audit.py"
      - "amsn-core/examples/human_prima_port_enrichment.py"
      - "amsn-core/tests/test_segev_reference_morphologies.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-order-nine-port:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - morphology_label: NMO_68174_cell1125
            morphology_path: data/human/segev/2013_03_06_cell11_1125_H41_06.CNG.swc
            expected_swc_records: "12410"
            mesh_cap_um: "0.125"
          - morphology_label: NMO_68174_cell1125
            morphology_path: data/human/segev/2013_03_06_cell11_1125_H41_06.CNG.swc
            expected_swc_records: "12410"
            mesh_cap_um: "0.0625"
          - morphology_label: NMO_68175_cell1204
            morphology_path: data/human/segev/2013_03_13_cell03_1204_H42_02.CNG.swc
            expected_swc_records: "13758"
            mesh_cap_um: "0.125"
          - morphology_label: NMO_68175_cell1204
            morphology_path: data/human/segev/2013_03_13_cell03_1204_H42_02.CNG.swc
            expected_swc_records: "13758"
            mesh_cap_um: "0.0625"
          - morphology_label: NMO_290988_Mohan2015
            morphology_path: data/human/1094_Mohan_etal_2015.CNG.swc
            expected_swc_records: "8903"
            mesh_cap_um: "0.125"
          - morphology_label: NMO_290988_Mohan2015
            morphology_path: data/human/1094_Mohan_etal_2015.CNG.swc
            expected_swc_records: "8903"
            mesh_cap_um: "0.0625"
    env:
      AMSN_MORPHOLOGY_LABEL: ${{ matrix.morphology_label }}
      AMSN_MORPHOLOGY_PATH: ${{ matrix.morphology_path }}
      AMSN_EXPECTED_SWC_RECORDS: ${{ matrix.expected_swc_records }}
      AMSN_NEURON_MAX_SEGMENT_UM: ${{ matrix.mesh_cap_um }}
      AMSN_PORT_ENRICHMENT: apical_basal_q25_q75
      AMSN_PRIMA_EXTENDED_ORDERS: "28,56,84,112,168"
      AMSN_SCHUR_OUTPUT_PREFIX: ${{ matrix.morphology_label }}_mesh${{ matrix.mesh_cap_um }}um_highorder_9port_
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Run complete AMSN test suite
        run: python -m pytest
        working-directory: amsn-core
      - name: Verify morphology record count
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from amsn.morphology import SWCMorphology
          path = Path(os.environ["AMSN_MORPHOLOGY_PATH"])
          morphology = SWCMorphology.from_file(path)
          expected = int(os.environ["AMSN_EXPECTED_SWC_RECORDS"])
          if len(morphology.nodes) != expected:
              raise RuntimeError(f"SWC record count {len(morphology.nodes)} != {expected}")
          print(f"morphology={os.environ['AMSN_MORPHOLOGY_LABEL']}")
          print(f"SWC_records={len(morphology.nodes)}")
          PY
        working-directory: amsn-core
      - name: Run nine-port order 28/56/84/112/168 sweep
        shell: bash
        run: |
          set -o pipefail
          python examples/human_schur_port_matrix_audit.py | tee "${{ matrix.morphology_label }}-mesh${{ matrix.mesh_cap_um }}um-9port-highorder.log"
        working-directory: amsn-core
      - name: Validate exact high-order sweep coverage
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path
          prefix = os.environ["AMSN_SCHUR_OUTPUT_PREFIX"]
          path = Path("results") / f"{prefix}human_passive_prima_extended_order_transient_sweep_2026-11-22.csv"
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          orders = tuple(int(value) for value in os.environ["AMSN_PRIMA_EXTENDED_ORDERS"].split(","))
          expected_models = len(orders) + 1
          expected = expected_models * (10 + 6 * (9 + 1))
          if len(rows) != expected:
              raise RuntimeError(f"expected {expected} rows, got {len(rows)}")
          counts = {}
          for row in rows:
              counts[row["metric"]] = counts.get(row["metric"], 0) + 1
          expected_counts = {
              "frequency_response": expected_models * 10,
              "transient_port": expected_models * 6 * 9,
              "transient_all_ports": expected_models * 6,
          }
          if counts != expected_counts:
              raise RuntimeError(f"metric coverage mismatch: {counts} != {expected_counts}")
          expected_ids = {"four_shift_order56_control"} | {f"six_shift_order{order}" for order in orders}
          actual_ids = {row["model_id"] for row in rows}
          if actual_ids != expected_ids:
              raise RuntimeError(f"model coverage mismatch: {actual_ids} != {expected_ids}")
          print(f"high_order_rows={len(rows)}; metric_counts={counts}; models={sorted(actual_ids)}")
          PY
        working-directory: amsn-core
      - name: Preserve high-order nine-port results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-${{ matrix.morphology_label }}-mesh-${{ matrix.mesh_cap_um }}um-9port-orders-28-168
          path: |
            amsn-core/${{ matrix.morphology_label }}-mesh${{ matrix.mesh_cap_um }}um-9port-highorder.log
            amsn-core/results/${{ matrix.morphology_label }}_mesh${{ matrix.mesh_cap_um }}um_highorder_9port_human_passive_prima_extended_order_transient_sweep_2026-11-22.csv
            amsn-core/results/${{ matrix.morphology_label }}_mesh${{ matrix.mesh_cap_um }}um_highorder_9port_human_passive_schur_port_summary_2026-11-22.csv
            amsn-core/results/${{ matrix.morphology_label }}_mesh${{ matrix.mesh_cap_um }}um_highorder_9port_human_passive_schur_port_localization_2026-11-22.csv
          if-no-files-found: error
