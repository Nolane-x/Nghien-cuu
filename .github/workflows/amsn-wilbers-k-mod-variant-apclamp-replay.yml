name: AMSN Wilbers released K MOD variants on original AP-clamp

on:
  push:
    branches:
      - research/wilbers-k-variant-apclamp-2026-11-23
    paths:
      - "amsn-core/examples/replay_wilbers_k_mod_variants.py"
      - "amsn-core/examples/replay_wilbers_apclamp.py"
      - "amsn-core/examples/audit_wilbers_k_mod_variants.py"
      - "amsn-core/tests/test_wilbers_k_mod_variant_replay.py"
      - "amsn-core/tests/test_wilbers_apclamp_replay.py"
      - "amsn-core/tests/test_wilbers_k_mod_variants.py"
      - ".github/workflows/amsn-wilbers-k-mod-variant-apclamp-replay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amsn-wilbers-k-mod-variant-apclamp-replay
  cancel-in-progress: false

jobs:
  released-k-variant-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEURON_NOGUI: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned NEURON and research dependencies
        working-directory: amsn-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" neuron==9.0.2 scipy==1.15.3 pandas==2.2.3 matplotlib==3.10.1 seaborn==0.13.2 openpyxl==3.1.5
      - name: Run protocol, source and analysis regression tests
        working-directory: amsn-core
        run: |
          python -m pytest -q \
            tests/test_wilbers_apclamp_replay.py \
            tests/test_wilbers_k_mod_variants.py \
            tests/test_wilbers_k_mod_variant_replay.py
      - name: Verify Dataverse bytes, compile nine unchanged K mechanisms and replay five/200 AP protocols
        working-directory: amsn-core
        run: |
          python examples/replay_wilbers_k_mod_variants.py \
            --output-json results/wilbers_k_mod_variant_apclamp_200_2026-11-23.json \
            --summary-csv results/wilbers_k_mod_variant_apclamp_summary_2026-11-23.csv \
            --per-ap-csv results/wilbers_k_mod_variant_apclamp_per_ap_2026-11-23.csv
      - name: Commit validated raw replay outputs to this research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            amsn-core/results/wilbers_k_mod_variant_apclamp_200_2026-11-23.json \
            amsn-core/results/wilbers_k_mod_variant_apclamp_summary_2026-11-23.csv \
            amsn-core/results/wilbers_k_mod_variant_apclamp_per_ap_2026-11-23.csv
          if ! git diff --cached --quiet; then
            git commit -m "results: archive validated Wilbers K variant AP-clamp replay"
            git push origin "HEAD:\${GITHUB_REF_NAME}"
          fi
      - name: Preserve source hashes, raw replay curves, comparisons and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilbers-released-k-mod-variant-apclamp-replay
          path: |
            amsn-core/results/wilbers_k_mod_variant_apclamp_200_2026-11-23.json
            amsn-core/results/wilbers_k_mod_variant_apclamp_summary_2026-11-23.csv
            amsn-core/results/wilbers_k_mod_variant_apclamp_per_ap_2026-11-23.csv
          if-no-files-found: warn
          retention-days: 90
