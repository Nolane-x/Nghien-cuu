name: PRIMA q25 four-morphology four-layout boundary ablation

on:
  push:
    branches:
      - research/prima-q25-cross-morphology-boundary-replication-2026-11-25
    paths:
      - ".github/workflows/amsn-prima-q25-four-layout-boundary-ablation.yml"
      - "amsn-core/research/analyze_prima_q25_four_morphology_four_layout_boundary_ablation.py"
      - "amsn-core/research/analyze_prima_q25_four_morphology_boundary_decomposition.py"
      - "amsn-core/research/analyze_prima_q25_short_window_boundary_decomposition.py"
      - "amsn-core/research/audit_prima_q25_basis_conditioning.py"
      - "amsn-core/research/audit_prima_q25_extended_backward_euler.py"
      - "amsn-core/examples/replay_nmo03524_prima_7v9port.py"
      - "amsn-core/examples/replay_nmo162186_prima_7v9port.py"
      - "amsn-core/examples/replay_nmo163775_four_layout_ablation.py"
      - "amsn-core/examples/replay_nmo107159_four_layout_replication.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/human_prima_port_enrichment.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/tests/test_prima_q25_four_morphology_four_layout_boundary_ablation.py"
      - "amsn-core/tests/test_prima_q25_cross_morphology_boundary_preflight.py"
      - "amsn-core/results/NMO_163775_PengControl_holdout/preflight.json"
      - "amsn-core/results/NMO_107159_TamasHumanPyramidalControl_holdout/preflight.json"
      - "amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_holdouts/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amsn-prima-q25-four-morphology-four-layout-boundary-ablation
  cancel-in-progress: false

jobs:
  four-morphology-four-layout-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEURON_NOGUI: "1"
      AMSN_NEURON_MAX_SEGMENT_UM: "0.5"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned numerical runtime
        working-directory: amsn-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron neuron==9.0.2
          python -m pip install --only-binary=scipy scipy==1.16.3
      - name: Download and verify Allen standardized SWC
        working-directory: amsn-core
        run: |
          mkdir -p data/human/allen_cell_types
          curl --fail --location --retry 4 --retry-delay 3 \
            --connect-timeout 20 --max-time 180 \
            --user-agent "AMSN-NeuroMorpho-Q25-FourLayout/0.1" \
            "https://neuromorpho.org/dableFiles/allen%20cell%20types/CNG%20version/770307286_transformed.CNG.swc" \
            --output data/human/allen_cell_types/770307286_transformed.CNG.swc
          echo "a05ad0770e857676b6be415f6f81a7548d69ccf74f62c7418756429c6a4105cc  data/human/allen_cell_types/770307286_transformed.CNG.swc" | sha256sum --check -
      - name: Run four-layout and finite-window regression tests
        working-directory: amsn-core
        run: |
          python -m pytest -q \
            tests/test_prima_q25_cross_morphology_boundary_preflight.py \
            tests/test_prima_q25_four_morphology_four_layout_boundary_ablation.py
      - name: Verify all four pinned q25 preflight contracts
        working-directory: amsn-core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = {
              "NMO_163775": Path("results/NMO_163775_PengControl_holdout/preflight.json"),
              "NMO_107159": Path("results/NMO_107159_TamasHumanPyramidalControl_holdout/preflight.json"),
              "NMO_03524": Path("results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_holdouts/NMO_03524_JacobsControl.json"),
              "NMO_162186": Path("results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_holdouts/NMO_162186_AllenL23.json"),
          }
          expected = {
              "NMO_163775": {"basal_q25": 224, "apical_q25": 4096},
              "NMO_107159": {"basal_q25": 6609, "apical_q25": 4404},
              "NMO_03524": {"basal_q25": 272, "apical_q25": 864},
              "NMO_162186": {"basal_q25": 2713, "apical_q25": 4488},
          }
          for key, path in files.items():
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload["status"] == "PASS", key
              observed = set(payload["amsn"]["q25_only_swc_node_ids"])
              assert observed == set(expected[key].values()), (key, observed)
              shared = payload["amsn"]["seven_unique_port_node_ids"]
              assert len(shared) == 7 and len(set(shared)) == 7, key
              cap = payload["neuron"].get(
                  "segment_cap_um",
                  payload["neuron"].get("maximum_segment_length_cap_um"),
              )
              assert cap == 0.5, (key, cap)
          print("PASS: all four morphology-specific q25 IDs and shared-seven IDs are pinned")
          PY
      - name: Run four-morphology 7/8/8/9-port finite-window boundary ablation
        working-directory: amsn-core
        run: |
          /usr/bin/time -f 'elapsed_wall_seconds=%e\nuser_cpu_seconds=%U\nsystem_cpu_seconds=%S\nmax_rss_kb=%M\nexit_status=%x' \
            -o results/prima_q25_four_morphology_four_layout_boundary_ablation_2026-11-25.time.txt \
            python research/analyze_prima_q25_four_morphology_four_layout_boundary_ablation.py
      - name: Assert four-layout coverage and finite-DFT identity
        working-directory: amsn-core
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          stem = "prima_q25_four_morphology_four_layout_boundary_ablation_2026-11-25"
          results = Path("results")
          report = json.loads((results / f"{stem}_report.json").read_text(encoding="utf-8"))
          assert report["status"] == "prima_q25_four_morphology_four_layout_boundary_ablation_passed"
          assert len(report["scope"]["morphologies"]) == 4
          assert report["scope"]["layouts"] == [
              "seven", "eight_basal_q25", "eight_apical_q25", "nine_both_q25"
          ]
          assert report["validation"]["all_morphology_preflights_passed"] is True
          assert report["validation"]["all_morphology_sha256_checked"] is True
          assert report["validation"]["max_finite_identity_relative_error"] <= 2e-8
          expected = {
              "frequency_summary": 1075536,
              "case_metrics": 12096,
              "layout_vs_seven_comparisons": 9072,
              "source_layout_window_summary": 144,
              "morphology_layout_window_summary": 24,
              "finite_dft_identity": 1728,
          }
          suffix = {
              "frequency_summary": "frequency_summary.csv",
              "case_metrics": "case_metrics.csv",
              "layout_vs_seven_comparisons": "layout_vs_seven_comparisons.csv",
              "source_layout_window_summary": "source_layout_window_summary.csv",
              "morphology_layout_window_summary": "morphology_layout_window_summary.csv",
              "finite_dft_identity": "finite_dft_identity.csv",
          }
          actual = {}
          for key, count in expected.items():
              path = results / f"{stem}_{suffix[key]}"
              with path.open(newline="", encoding="utf-8") as handle:
                  observed = sum(1 for _ in csv.DictReader(handle))
              actual[key] = observed
              assert observed == count, f"{key}: {observed} != {count}"
          assert report["exact_coverage"]["csv_read_back"] == expected
          print(json.dumps({
              "status": report["status"],
              "expected_rows": expected,
              "actual_readback": actual,
              "max_identity_relative_error": report["validation"]["max_finite_identity_relative_error"],
              "morphologies": [m["morphology"] for m in report["scope"]["morphologies"]],
              "layouts": report["scope"]["layouts"],
              "runtime": report["runtime"],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit four-layout ablation results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amsn-core/results/prima_q25_four_morphology_four_layout_boundary_ablation_2026-11-25_*.csv \
                  amsn-core/results/prima_q25_four_morphology_four_layout_boundary_ablation_2026-11-25_report.json
          if ! git diff --cached --quiet; then
            git commit -m "results: archive four-morphology q25 four-layout boundary ablation"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve full four-layout matrix and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prima-q25-four-morphology-four-layout-boundary-ablation
          path: |
            amsn-core/data/human/allen_cell_types/770307286_transformed.CNG.swc
            amsn-core/results/NMO_163775_PengControl_holdout/preflight.json
            amsn-core/results/NMO_107159_TamasHumanPyramidalControl_holdout/preflight.json
            amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_holdouts/*.json
            amsn-core/results/prima_q25_four_morphology_four_layout_boundary_ablation_2026-11-25_*.csv
            amsn-core/results/prima_q25_four_morphology_four_layout_boundary_ablation_2026-11-25_report.json
            amsn-core/results/prima_q25_four_morphology_four_layout_boundary_ablation_2026-11-25.time.txt
          if-no-files-found: error
          retention-days: 90
