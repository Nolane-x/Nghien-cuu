name: NMO_107159 Tamas human pyramidal Control matched 7-port vs 9-port PRIMA

on:
  push:
    branches:
      - research/prima-tamas-human-pyramidal-fourth-morphology-2026-11-24
    paths:
      - ".github/workflows/amsn-nmo107159-tamas-human-pyramidal-matched-order.yml"
      - "amsn-core/examples/replay_nmo107159_tamas_7v9port.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/human_prima_port_enrichment.py"
      - "amsn-core/examples/prepare_nmo107159_tamas_holdout.py"
      - "amsn-core/tests/test_nmo107159_tamas_7v9port.py"
      - "amsn-core/tests/test_tamas_pyramidal_holdout.py"
      - "amsn-core/data/human/neuromorpho_tamas/NMO_107159_Fig5c_141009_2og_B.CNG.swc"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amsn-nmo107159-tamas-prima-7v9port-matched-order
  cancel-in-progress: false

jobs:
  matched-port-order-control-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEURON_NOGUI: "1"
      AMSN_NEURON_MAX_SEGMENT_UM: "0.5"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON
        working-directory: amsn-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron neuron==9.0.2
      - name: Verify pinned Tamas human pyramidal Control SWC in repository
        working-directory: amsn-core
        run: |
          test -s data/human/neuromorpho_tamas/NMO_107159_Fig5c_141009_2og_B.CNG.swc
          echo "6b3b00905fe3659132dbda67ad4f0f30287984e75d5bde41ba79f61b6d479023  data/human/neuromorpho_tamas/NMO_107159_Fig5c_141009_2og_B.CNG.swc" | sha256sum --check -
      - name: Run complete AMSN regression suite
        working-directory: amsn-core
        run: python -m pytest
      - name: Verify Tamas human pyramidal Control source parser and metadata
        working-directory: amsn-core
        run: python -m pytest -q tests/test_tamas_pyramidal_holdout.py tests/test_nmo107159_tamas_7v9port.py
      - name: Re-run Import3D, seven canonical ports and passive preflight
        working-directory: amsn-core
        run: python examples/prepare_nmo107159_tamas_holdout.py
      - name: Replay matched order112/order168 with seven and nine ports
        working-directory: amsn-core
        run: |
          /usr/bin/time -f 'elapsed_wall_seconds=%e\nuser_cpu_seconds=%U\nsystem_cpu_seconds=%S\nmax_rss_kb=%M\nexit_status=%x' -o results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24.time.txt python examples/replay_nmo107159_tamas_7v9port.py
      - name: Commit validated matched-port results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          REPORT="amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24_report.json"
          SUMMARY="amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24_matched_summary.csv"
          Q25="amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24_q25_summary.csv"
          if git cat-file -e "origin/$GITHUB_REF_NAME:$REPORT" \
             && git cat-file -e "origin/$GITHUB_REF_NAME:$SUMMARY" \
             && git cat-file -e "origin/$GITHUB_REF_NAME:$Q25"; then
            echo "A validated matched-port result set is already archived on the remote branch; keeping that commit and preserving this run as a separate artifact."
          else
            git add amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24_*.csv \
                    amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24_report.json \
                    amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24.time.txt \
                    amsn-core/results/NMO_107159_TamasHumanPyramidalControl_holdout/preflight.json \
                    amsn-core/results/NMO_107159_TamasHumanPyramidalControl_holdout/port_mapping.csv
            if ! git diff --cached --quiet; then
              git commit -m "results: archive Tamas human pyramidal Control matched 7-port 9-port comparison"
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
      - name: Preserve paired curves, q25 outputs and Hines checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmo107159-tamas-human-prima-7v9port-matched-order
          path: |
            amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24_*.csv
            amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24_report.json
            amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24.time.txt
            amsn-core/results/NMO_107159_TamasHumanPyramidalControl_holdout/preflight.json
            amsn-core/results/NMO_107159_TamasHumanPyramidalControl_holdout/port_mapping.csv
          if-no-files-found: warn
          retention-days: 90
