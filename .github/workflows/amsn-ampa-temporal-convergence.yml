name: AMSN Fast AMPA Temporal Convergence Audit

on:
  push:
    branches: [main]
    paths:
      - "amsn-core/examples/human_ampa_temporal_convergence.py"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/synapses.py"
      - "amsn-core/src/amsn/sectioned.py"
      - "amsn-core/src/amsn/morphology.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-ampa-temporal-convergence.yml"
  pull_request:
    branches: [main]
    paths:
      - "amsn-core/examples/human_ampa_temporal_convergence.py"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/synapses.py"
      - "amsn-core/src/amsn/sectioned.py"
      - "amsn-core/src/amsn/morphology.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-ampa-temporal-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amsn-ampa-temporal-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ampa-temporal-convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON reference simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Verify NEURON and morphology fixture
        run: |
          python -c "import neuron; print('NEURON', neuron.__version__)"
          test -s data/human/1094_Mohan_etal_2015.CNG.swc
        working-directory: amsn-core
      - name: Run fast-AMPA temporal convergence sweep
        shell: bash
        run: set -o pipefail; python examples/human_ampa_temporal_convergence.py | tee ampa-temporal-convergence.txt
        working-directory: amsn-core
      - name: Preserve raw temporal sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-ampa-temporal-convergence-py3.12
          path: amsn-core/ampa-temporal-convergence.txt
          if-no-files-found: ignore
