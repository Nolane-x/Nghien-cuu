name: AMSN Full-Tree Axial Conductance Matrix Audit

on:
  push:
    branches: [main]
    paths:
      - "amsn-core/examples/human_full_tree_axial_matrix_audit.py"
      - "amsn-core/examples/human_full_tree_axial_network_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/morphology.py"
      - "amsn-core/src/amsn/sectioned.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-full-tree-axial-matrix-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "amsn-core/examples/human_full_tree_axial_matrix_audit.py"
      - "amsn-core/examples/human_full_tree_axial_network_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/morphology.py"
      - "amsn-core/src/amsn/sectioned.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-full-tree-axial-matrix-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amsn-full-tree-axial-matrix-audit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  axial-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON reference simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Verify NEURON and morphology fixture
        run: |
          python -c "import neuron; print('NEURON', neuron.__version__)"
          test -s data/human/1094_Mohan_etal_2015.CNG.swc
        working-directory: amsn-core
      - name: Run full-tree axial conductance matrix audit
        shell: bash
        run: set -o pipefail; python examples/human_full_tree_axial_matrix_audit.py | tee human-full-tree-axial-matrix-audit.txt
        working-directory: amsn-core
      - name: Preserve conductance matrix audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-full-tree-axial-conductance-matrix-py3.12
          path: |
            amsn-core/human-full-tree-axial-matrix-audit.txt
            amsn-core/results/human_full_tree_axial_matrix_edges_2026-11-21.csv
            amsn-core/results/human_full_tree_axial_matrix_probes_2026-11-21.csv
          if-no-files-found: ignore
