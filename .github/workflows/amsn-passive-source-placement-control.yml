name: AMSN Controlled Passive Source-Placement Audit

on:
  push:
    branches: [main]
    paths:
      - "amsn-core/examples/human_passive_source_placement_control.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/**"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-passive-source-placement-control.yml"
  pull_request:
    branches: [main]
    paths:
      - "amsn-core/examples/human_passive_source_placement_control.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/**"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-passive-source-placement-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Verify morphology and NEURON
        run: |
          python -c "import neuron; print('NEURON', neuron.__version__)"
          test -s data/human/1094_Mohan_etal_2015.CNG.swc
        working-directory: amsn-core
      - name: Run controlled source-placement comparison
        shell: bash
        run: |
          set -o pipefail
          python examples/human_passive_source_placement_control.py | tee human-passive-source-placement-control.csv
        working-directory: amsn-core
      - name: Preserve raw controlled comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-controlled-passive-source-placement-py3.12
          path: amsn-core/human-passive-source-placement-control.csv
          if-no-files-found: ignore
