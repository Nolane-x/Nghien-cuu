name: AMSN Passive Source-Alignment Sensitivity Audit

on:
  push:
    branches: [main]
    paths:
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/**"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-passive-source-alignment-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/**"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-passive-source-alignment-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-alignment:
    name: source-alignment (${{ matrix.alignment_um }} um tolerance)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        alignment_um: ["0", "0.001"]
    env:
      AMSN_NEURON_MAX_SEGMENT_UM: "0.125"
      AMSN_SOURCE_ALIGNMENT_TOLERANCE_UM: ${{ matrix.alignment_um }}
      AMSN_SOURCE_ALIGNMENT_MAX_NSEG: "50001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Verify source-alignment configuration
        run: |
          python -c "import neuron; print('NEURON', neuron.__version__)"
          echo "mesh=$AMSN_NEURON_MAX_SEGMENT_UM um; source tolerance=$AMSN_SOURCE_ALIGNMENT_TOLERANCE_UM um"
          test -s data/human/1094_Mohan_etal_2015.CNG.swc
        working-directory: amsn-core
      - name: Run passive source-alignment comparison
        shell: bash
        run: |
          set -o pipefail
          python examples/human_fine_mesh_passive_dc_audit.py | tee "human-source-alignment-$AMSN_SOURCE_ALIGNMENT_TOLERANCE_UM-um.csv"
        working-directory: amsn-core
      - name: Preserve source-alignment output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-passive-source-alignment-${{ matrix.alignment_um }}um-py3.12
          path: amsn-core/human-source-alignment-${{ matrix.alignment_um }}-um.csv
          if-no-files-found: ignore
