name: Research-only PRIMA four-morphology output-aware dual-seed sweep

on:
  push:
    branches:
      - research/prima-q25-cross-morphology-boundary-replication-2026-11-25
    paths:
      - ".github/workflows/amsn-prima-q25-four-morphology-output-aware-dual-seed-sweep.yml"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/prima.py"
      - "amsn-core/research/**"
      - "amsn-core/examples/replay_nmo*.py"
      - "amsn-core/data/**/*.swc"
      - "amsn-core/results/**preflight*.json"
      - "amsn-core/pyproject.toml"
      - "amsn-core/tests/test_prima_q25_output_aware_dual_seed_basis.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amsn-prima-q25-four-morphology-output-aware-dual-seed
  cancel-in-progress: false

jobs:
  four-morphology-dual-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEURON_NOGUI: "1"
      AMSN_NEURON_MAX_SEGMENT_UM: "0.5"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "Haswell"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      NPY_DISABLE_CPU_FEATURES: "X86_V4,AVX512_ICL,AVX512_SPR"
      AMSN_PRIMA_BASIS_ORDER: "224"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install pinned AMSN numerical runtime
        working-directory: amsn-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=numpy numpy==2.5.5
          python -m pip install --only-binary=neuron neuron==9.0.2
          python -m pip install --only-binary=scipy scipy==1.16.3
          python -m pip install threadpoolctl==3.6.0
      - name: Verify all four morphology checksums and preflights
        working-directory: amsn-core
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, "research")
          import analyze_prima_q25_four_morphology_four_layout_boundary_ablation as core

          assert len(core.MORPHOLOGIES) == 4, len(core.MORPHOLOGIES)
          records = []
          scenario_names = list(core.SCENARIO_NAMES)
          assert len(scenario_names) == 9, scenario_names
          for spec in core.MORPHOLOGIES:
              swc = Path(spec["module"].SWC)
              digest = hashlib.sha256(swc.read_bytes()).hexdigest()
              assert digest == spec["expected_sha256"], (spec["neuromorpho_id"], digest)
              preflight = json.loads(Path(spec["preflight"]).read_text())
              assert preflight["status"] == "PASS", spec["neuromorpho_id"]
              assert preflight["source"]["source_sha256"] == digest, spec["neuromorpho_id"]
              assert len(spec["module"].baseline.parameter_cases()) == 9
              assert list(spec["module"].baseline.parameter_cases()) == scenario_names
              records.append({
                  "neuromorpho_id": spec["neuromorpho_id"],
                  "name": spec["name"],
                  "records": spec["expected_records"],
                  "swc_sha256": digest,
                  "preflight": preflight["status"],
              })
          print(json.dumps({"morphologies": records, "scenarios": scenario_names}, indent=2))
          PY
      - name: Preflight and export active NumPy SIMD dispatch targets
        working-directory: amsn-core
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "research")
          from analyze_prima_q25_four_morphology_four_layout_boundary_ablation import (
              numpy_current_dispatch_targets,
          )
          targets = numpy_current_dispatch_targets()
          assert targets, "no active NumPy SIMD targets detected"
          unsupported = [
              item for item in targets
              if "X86_V4" in item.upper() or "AVX512" in item.upper()
          ]
          assert not unsupported, unsupported
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write("AMSN_NUMPY_ACTIVE_DISPATCH_TARGETS_JSON=" + json.dumps(targets) + chr(10))
          print(json.dumps({"active_numpy_dispatch_targets": targets}, indent=2))
          PY
      - name: Compile research runners and prototype
        working-directory: amsn-core
        run: |
          python -m compileall -q research/experimental_prima_output_aware_basis.py
          python -m compileall -q research/run_prima_q25_peng_output_aware_dual_seed_pilot.py
          python -m compileall -q research/run_prima_q25_four_morphology_output_aware_dual_seed_sweep.py
      - name: Run focused output-aware dual-seed invariants
        working-directory: amsn-core
        run: python -m pytest -q tests/test_prima_q25_output_aware_dual_seed_basis.py
      - name: Run four-morphology, nine-scenario dual-seed sweep
        working-directory: amsn-core
        run: python research/run_prima_q25_four_morphology_output_aware_dual_seed_sweep.py
      - name: Verify global coverage, paired summaries and DFT identities
        working-directory: amsn-core
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          stem = "prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25"
          results = Path("results")
          report = json.loads((results / f"{stem}_report.json").read_text())
          assert report["status"] == "passed"
          expected = {
              "worker_groups_passed": 36,
              "case_metrics_read_back": 19440,
              "group_summary_read_back": 3240,
              "morphology_summary_read_back": 360,
              "scenario_summary_read_back": 810,
              "pooled_summary_read_back": 90,
              "finite_dft_identity_read_back": 72,
              "basis_metadata_rows": 180,
          }
          for key, value in expected.items():
              assert report["coverage"][key] == value, (key, report["coverage"][key])
          assert report["dft_identity"]["all_rows_passed"] is True
          for suffix, count in [
              ("case_metrics", 19440),
              ("group_summary", 3240),
              ("morphology_summary", 360),
              ("scenario_summary", 810),
              ("pooled_summary", 90),
              ("finite_dft_identity", 72),
          ]:
              path = results / f"{stem}_{suffix}.csv"
              with path.open(newline="") as handle:
                  assert len(list(csv.DictReader(handle))) == count, path
          metadata = json.loads((results / f"{stem}_basis_metadata.json").read_text())
          assert len(metadata) == 180
          assert all(item["actual_order"] == 224 and item["seven_input_ports_unchanged"]
                     for item in metadata)
          print(json.dumps({"status":report["status"],"coverage":report["coverage"],
                            "dft_identity":report["dft_identity"]},indent=2))
          PY
      - name: Commit verified matrices and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_case_metrics.csv             amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_group_summary.csv             amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_morphology_summary.csv             amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_scenario_summary.csv             amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_pooled_summary.csv             amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_finite_dft_identity.csv             amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_basis_metadata.json             amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_report.json             amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25.time.txt
          git commit -m "results: archive four-morphology q25 dual-seed sweep"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Preserve full source and numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: prima-q25-four-morphology-output-aware-dual-seed-order224
          path: |
            amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_*.csv
            amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_basis_metadata.json
            amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25_report.json
            amsn-core/results/prima_q25_four_morphology_output_aware_dual_seed_order224_2026-11-25.time.txt
            amsn-core/results/NMO_163775_PengControl_holdout/preflight.json
            amsn-core/results/NMO_107159_TamasHumanPyramidalControl_holdout/preflight.json
            amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_holdouts/NMO_03524_JacobsControl.json
            amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_holdouts/NMO_162186_AllenL23.json
          if-no-files-found: error
          retention-days: 90
