name: AMSN Human PRIMA Shift-Order Pareto Sweep
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/amsn-human-prima-shift-order-pareto.yml"
      - "amsn-core/examples/human_prima_shift_order_pareto.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/**"
      - "amsn-core/tests/**"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shift-order-pareto:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - morphology_label: NMO_68174_cell1125
            morphology_path: data/human/segev/2013_03_06_cell11_1125_H41_06.CNG.swc
            expected_swc_records: "12410"
          - morphology_label: NMO_68175_cell1204
            morphology_path: data/human/segev/2013_03_13_cell03_1204_H42_02.CNG.swc
            expected_swc_records: "13758"
          - morphology_label: NMO_290988_Mohan2015
            morphology_path: data/human/1094_Mohan_etal_2015.CNG.swc
            expected_swc_records: "8903"
    env:
      AMSN_MORPHOLOGY_LABEL: ${{ matrix.morphology_label }}
      AMSN_MORPHOLOGY_PATH: ${{ matrix.morphology_path }}
      AMSN_EXPECTED_SWC_RECORDS: ${{ matrix.expected_swc_records }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Run full AMSN test suite
        run: python -m pytest
        working-directory: amsn-core
      - name: Run order and shift-distribution Pareto sweep
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'elapsed_wall_seconds=%e\nuser_cpu_seconds=%U\nsystem_cpu_seconds=%S\nmax_rss_kb=%M\nexit_status=%x' \
            -o "${AMSN_MORPHOLOGY_LABEL}-pareto-resource.time.txt" \
            python examples/human_prima_shift_order_pareto.py | tee "${AMSN_MORPHOLOGY_LABEL}-pareto.log"
        working-directory: amsn-core
      - name: Preserve raw Pareto data and process resource profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-${{ matrix.morphology_label }}-prima-shift-order-pareto
          path: |
            amsn-core/results/${{ matrix.morphology_label }}_human_prima_shift_order_pareto_2026-11-22_models.csv
            amsn-core/results/${{ matrix.morphology_label }}_human_prima_shift_order_pareto_2026-11-22_frequency.csv
            amsn-core/results/${{ matrix.morphology_label }}_human_prima_shift_order_pareto_2026-11-22_transient.csv
            amsn-core/${{ matrix.morphology_label }}-pareto-resource.time.txt
            amsn-core/${{ matrix.morphology_label }}-pareto.log
          if-no-files-found: error
