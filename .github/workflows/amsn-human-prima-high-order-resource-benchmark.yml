name: AMSN Human Passive PRIMA High-Order Runtime and Memory Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/amsn-human-prima-high-order-resource-benchmark.yml"
      - "amsn-core/examples/human_schur_port_matrix_audit.py"
      - "amsn-core/examples/human_prima_port_enrichment.py"
      - "amsn-core/src/amsn/**"
      - "amsn-core/tests/test_resource_benchmark.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-resource-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AMSN test dependencies
        run: python -m pip install -e ".[test]"
        working-directory: amsn-core
      - name: Test resource benchmark validator
        run: python -m pytest tests/test_resource_benchmark.py
        working-directory: amsn-core

  resource-benchmark:
    needs: validate-resource-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
