name: AMSN Core CI

on:
  push:
    branches: [main]
    paths:
      - "amsn-core/**"
      - ".github/workflows/amsn-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "amsn-core/**"
      - ".github/workflows/amsn-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amsn-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
        working-directory: amsn-core
      - name: Run unit and numerical validation tests
        run: python -m pytest -q
        working-directory: amsn-core
      - name: Compile all Python modules
        run: python -m compileall -q src tests examples
        working-directory: amsn-core
      - name: Run examples
        run: |
          python examples/inspect_swc.py
          python examples/passive_tree.py
          python examples/scaling_smoke.py
          python examples/electrotonic_refinement.py
          python examples/passive_mesh_convergence.py
        working-directory: amsn-core
