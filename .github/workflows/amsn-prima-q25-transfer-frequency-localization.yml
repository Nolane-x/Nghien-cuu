name: PRIMA q25 transfer frequency localization

on:
  push:
    branches:
      - research/prima-q25-transfer-frequency-localization-2026-11-24
    paths:
      - ".github/workflows/amsn-prima-q25-transfer-frequency-localization.yml"
      - "amsn-core/research/analyze_prima_q25_transfer_frequency_localization.py"
      - "amsn-core/tests/test_prima_q25_transfer_frequency_localization.py"
      - "amsn-core/results/prima_q25_krylov_transfer_stages_cross_morphology_2026-11-24_frequency.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amsn-prima-q25-transfer-frequency-localization
  cancel-in-progress: false

jobs:
  transfer-frequency-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install numpy pytest
      - name: Verify upstream transfer frequency matrix exists
        run: |
          test -s amsn-core/results/prima_q25_krylov_transfer_stages_cross_morphology_2026-11-24_frequency.csv
      - name: Run frequency localization tests
        working-directory: amsn-core
        run: python -m pytest -q tests/test_prima_q25_transfer_frequency_localization.py
      - name: Build frequency-localized residual maps
        working-directory: amsn-core
        run: python research/analyze_prima_q25_transfer_frequency_localization.py
      - name: Commit frequency-localized outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amsn-core/results/prima_q25_transfer_frequency_localization_2026-11-24_*.csv \
                  amsn-core/results/prima_q25_transfer_frequency_localization_2026-11-24_report.json
          if ! git diff --cached --quiet; then
            git commit -m "results: archive q25 transfer frequency localization"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve frequency localization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prima-q25-transfer-frequency-localization
          path: |
            amsn-core/results/prima_q25_transfer_frequency_localization_2026-11-24_*.csv
            amsn-core/results/prima_q25_transfer_frequency_localization_2026-11-24_report.json
          if-no-files-found: warn
          retention-days: 90
