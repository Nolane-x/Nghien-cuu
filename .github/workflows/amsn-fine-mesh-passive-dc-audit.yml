name: AMSN Fine-Mesh Full-Tree Passive DC Audit

on:
  push:
    branches: [main]
    paths:
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/morphology.py"
      - "amsn-core/src/amsn/sectioned.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-fine-mesh-passive-dc-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/morphology.py"
      - "amsn-core/src/amsn/sectioned.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-fine-mesh-passive-dc-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passive-dc:
    name: passive-dc (${{ matrix.segment_um }} um NEURON mesh)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        segment_um: ["0.5", "0.25"]
    concurrency:
      group: amsn-fine-mesh-passive-dc-${{ matrix.segment_um }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      AMSN_NEURON_MAX_SEGMENT_UM: ${{ matrix.segment_um }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON reference simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Verify NEURON and morphology fixture
        run: |
          python -c "import neuron; print('NEURON', neuron.__version__)"
          echo "AMSN_NEURON_MAX_SEGMENT_UM=$AMSN_NEURON_MAX_SEGMENT_UM"
          test -s data/human/1094_Mohan_etal_2015.CNG.swc
        working-directory: amsn-core
      - name: Run fine-mesh passive DC comparison
        shell: bash
        run: |
          set -o pipefail
          python examples/human_fine_mesh_passive_dc_audit.py | tee "human-fine-mesh-passive-dc-$AMSN_NEURON_MAX_SEGMENT_UM-um.csv"
        working-directory: amsn-core
      - name: Preserve passive DC result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-fine-mesh-passive-dc-${{ matrix.segment_um }}um-py3.12
          path: amsn-core/human-fine-mesh-passive-dc-${{ matrix.segment_um }}-um.csv
          if-no-files-found: ignore
