name: NMO_03524 Jacobs control morphology PRIMA holdout

on:
  push:
    branches:
      - research/prima-jacobs-control-independent-holdout-2026-11-23
    paths:
      - ".github/workflows/amsn-jacobs-control-prima-holdout.yml"
      - "amsn-core/examples/prepare_jacobs_control_holdout.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/human_prima_shift_order_pareto_jacobs_control.py"
      - "amsn-core/examples/summarize_jacobs_control_holdout.py"
      - "amsn-core/tests/test_jacobs_control_holdout.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amsn-jacobs-control-prima-holdout
  cancel-in-progress: false

jobs:
  control-morphology-shift-order:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEURON_NOGUI: "1"
      AMSN_NEURON_MAX_SEGMENT_UM: "0.125"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN test and pinned NEURON dependencies
        working-directory: amsn-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
      - name: Download standardized Jacobs control SWC
        working-directory: amsn-core
        run: |
          mkdir -p data/human/neuromorpho_jacobs
          curl --fail --location --retry 4 --retry-delay 3 \
            --connect-timeout 20 --max-time 180 \
            --user-agent "AMSN-NeuroMorpho-PRIMA-Holdout/0.1" \
            "https://neuromorpho.org/dableFiles/jacobs/CNG%20version/1-5-3.CNG.swc" \
            --output data/human/neuromorpho_jacobs/1-5-3.CNG.swc
      - name: Run complete AMSN regression suite
        working-directory: amsn-core
        run: python -m pytest
      - name: Verify source parser and pinned NeuroMorpho metadata
        working-directory: amsn-core
        run: python -m pytest -q tests/test_jacobs_control_holdout.py
      - name: Preflight source hash, morphology topology, Import3D, seven ports and passive response
        working-directory: amsn-core
        run: python examples/prepare_jacobs_control_holdout.py
      - name: Run nine-candidate PRIMA shift/order Pareto matrix
        working-directory: amsn-core
        env:
          AMSN_MORPHOLOGY_LABEL: NMO_03524_JacobsControl
          AMSN_MORPHOLOGY_PATH: data/human/neuromorpho_jacobs/1-5-3.CNG.swc
          AMSN_EXPECTED_SWC_RECORDS: "869"
        run: |
          /usr/bin/time -f 'elapsed_wall_seconds=%e\nuser_cpu_seconds=%U\nsystem_cpu_seconds=%S\nmax_rss_kb=%M\nexit_status=%x' \
            -o results/NMO_03524_JacobsControl_prima_shift_order_2026-11-23.time.txt \
            python examples/human_prima_shift_order_pareto_jacobs_control.py
      - name: Validate complete matrix and summarize candidates
        working-directory: amsn-core
        run: python examples/summarize_jacobs_control_holdout.py
      - name: Commit pinned morphology and validated results to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            amsn-core/data/human/neuromorpho_jacobs/1-5-3.CNG.swc \
            amsn-core/data/human/neuromorpho_jacobs/NMO_03524_PROVENANCE.md \
            amsn-core/results/NMO_03524_JacobsControl_holdout \
            amsn-core/results/NMO_03524_JacobsControl_human_prima_shift_order_pareto_2026-11-23_*.csv \
            amsn-core/results/NMO_03524_JacobsControl_human_prima_shift_order_pareto_2026-11-23_report.json \
            amsn-core/results/NMO_03524_JacobsControl_prima_shift_order_2026-11-23.time.txt
          if ! git diff --cached --quiet; then
            git commit -m "results: archive Jacobs control PRIMA holdout sweep"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve morphology, preflight and candidate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmo03524-jacobs-control-prima-holdout
          path: |
            amsn-core/data/human/neuromorpho_jacobs/1-5-3.CNG.swc
            amsn-core/results/NMO_03524_JacobsControl_holdout
            amsn-core/results/NMO_03524_JacobsControl_human_prima_shift_order_pareto_2026-11-23_*.csv
            amsn-core/results/NMO_03524_JacobsControl_human_prima_shift_order_pareto_2026-11-23_report.json
            amsn-core/results/NMO_03524_JacobsControl_prima_shift_order_2026-11-23.time.txt
          if-no-files-found: warn
          retention-days: 90
