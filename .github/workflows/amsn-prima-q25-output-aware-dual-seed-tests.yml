name: Research-only PRIMA q25 output-aware dual-seed tests

on:
  push:
    branches:
      - research/prima-q25-cross-morphology-boundary-replication-2026-11-25
    paths:
      - ".github/workflows/amsn-prima-q25-output-aware-dual-seed-tests.yml"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/prima.py"
      - "amsn-core/research/experimental_prima_output_aware_basis.py"
      - "amsn-core/tests/test_prima_q25_output_aware_dual_seed_basis.py"
      - "amsn-core/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amsn-prima-q25-output-aware-dual-seed-tests
  cancel-in-progress: false

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: amsn-core
    env:
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "Haswell"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN core and pinned test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=numpy numpy==2.5.5
      - name: Compile the research prototype
        run: |
          python -m compileall -q research/experimental_prima_output_aware_basis.py
          python -m compileall -q tests/test_prima_q25_output_aware_dual_seed_basis.py
      - name: Run output-aware seed invariants and passivity tests
        run: |
          python -m pytest -q tests/test_prima_q25_output_aware_dual_seed_basis.py
