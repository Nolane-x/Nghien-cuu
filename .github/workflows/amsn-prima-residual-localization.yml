name: PRIMA matched residual localization

on:
  push:
    branches:
      - research/prima-residual-localization-2026-11-24
    paths:
      - ".github/workflows/amsn-prima-residual-localization.yml"
      - "amsn-core/research/analyze_prima_matched_residuals.py"
      - "amsn-core/research/synthesize_prima_cross_morphology.py"
      - "amsn-core/tests/test_prima_matched_residuals.py"
      - "amsn-core/results/NMO_162186_prima_7v9port_matched_order_2026-11-23_matched_shared.csv"
      - "amsn-core/results/NMO_03524_JacobsControl_prima_7v9port_matched_order_2026-11-23_matched_shared.csv"
      - "amsn-core/results/NMO_163775_PengControl_prima_7v9port_matched_order_2026-11-24_matched_shared.csv"
      - "amsn-core/results/NMO_107159_TamasHumanPyramidalControl_prima_7v9port_matched_order_2026-11-24_matched_shared.csv"
      - "HANDOFF_2026-11-24_PRIMA-RESIDUAL-LOCALIZATION.md"
      - "research/RESEARCH_LOG_2026-11-24_PRIMA-RESIDUAL-LOCALIZATION.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amsn-prima-residual-localization
  cancel-in-progress: false

jobs:
  validate-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run residual-localization regression tests
        run: python -m unittest discover -s amsn-core/tests -p "test_prima_matched_residuals.py" -v
      - name: Generate per-source and per-output diagnostics
        run: python amsn-core/research/analyze_prima_matched_residuals.py --write
      - name: Verify deterministic diagnostic outputs
        run: python amsn-core/research/analyze_prima_matched_residuals.py --check
      - name: Commit validated diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amsn-core/research/PRIMA_MATCHED_RESIDUAL_DIAGNOSTICS_2026-11-24.md \
                  amsn-core/results/prima_matched_residual_diagnostics_2026-11-24.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: archive PRIMA matched residual localization"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Residual diagnostics are already current."
          fi
