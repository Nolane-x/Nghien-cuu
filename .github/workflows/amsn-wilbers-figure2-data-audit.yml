name: AMSN Wilbers Figure 2 raw AP-clamp data audit

on:
  push:
    branches:
      - research/wilbers-human-active-channel-baseline-2026-11-22
    paths:
      - "amsn-core/examples/audit_wilbers_figure2_data.py"
      - "amsn-core/tests/test_wilbers_figure2_data_audit.py"
      - "amsn-core/research/references/wilbers2023_dataverse_source_manifest_2026-11-22.json"
      - ".github/workflows/amsn-wilbers-figure2-data-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amsn-wilbers-figure2-data-audit
  cancel-in-progress: false

jobs:
  workbook-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader and test dependencies
        working-directory: amsn-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" openpyxl==3.1.5
      - name: Test parser and descriptive-statistics helpers
        working-directory: amsn-core
        run: python -m pytest -q tests/test_wilbers_figure2_data_audit.py tests/test_human_channel_evidence_registry.py
      - name: Download, checksum and analyze original Figure 2 workbooks
        working-directory: amsn-core
        run: python examples/audit_wilbers_figure2_data.py --output artifacts/wilbers-figure2-data-audit.json
      - name: Upload workbook audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilbers-figure2-raw-data-audit
          path: amsn-core/artifacts/wilbers-figure2-data-audit.json
          if-no-files-found: warn
          retention-days: 30
