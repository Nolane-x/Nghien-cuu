name: PRIMA q25 cross-morphology boundary replication preflight

on:
  push:
    branches:
      - research/prima-q25-cross-morphology-boundary-replication-2026-11-25
    paths:
      - ".github/workflows/amsn-prima-q25-cross-morphology-boundary-replication.yml"
      - "amsn-core/examples/prepare_prima_q25_cross_morphology_boundary_holdouts.py"
      - "amsn-core/examples/replay_nmo03524_prima_7v9port.py"
      - "amsn-core/examples/replay_nmo162186_prima_7v9port.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/human_prima_port_enrichment.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/tests/test_prima_q25_cross_morphology_boundary_preflight.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amsn-prima-q25-cross-morphology-boundary-replication
  cancel-in-progress: false

jobs:
  q25-cross-morphology-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEURON_NOGUI: "1"
      AMSN_NEURON_MAX_SEGMENT_UM: "0.5"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned numerical runtime
        working-directory: amsn-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron neuron==9.0.2
          python -m pip install --only-binary=scipy scipy==1.16.3
      - name: Download Allen standardized SWC from NeuroMorpho
        working-directory: amsn-core
        run: |
          mkdir -p data/human/allen_cell_types
          curl --fail --location --retry 4 --retry-delay 3             --connect-timeout 20 --max-time 180             --user-agent "AMSN-NeuroMorpho-Q25-Preflight/0.1"             "https://neuromorpho.org/dableFiles/allen%20cell%20types/CNG%20version/770307286_transformed.CNG.swc"             --output data/human/allen_cell_types/770307286_transformed.CNG.swc
          echo "a05ad0770e857676b6be415f6f81a7548d69ccf74f62c7418756429c6a4105cc  data/human/allen_cell_types/770307286_transformed.CNG.swc" | sha256sum --check -
      - name: Verify focused q25 mapping invariants
        working-directory: amsn-core
        run: python -m pytest -q tests/test_prima_q25_cross_morphology_boundary_preflight.py
      - name: Run both Import3D preflights at the common 0.5-um cap
        working-directory: amsn-core
        run: |
          /usr/bin/time -f 'elapsed_wall_seconds=%e\nuser_cpu_seconds=%U\nsystem_cpu_seconds=%S\nmax_rss_kb=%M\nexit_status=%x'             -o results/prima_q25_cross_morphology_boundary_preflight_2026-11-25.time.txt             python examples/prepare_prima_q25_cross_morphology_boundary_holdouts.py
      - name: Commit validated source and port-mapping evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_report.json \
                  amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_mapping.csv \
                  amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25.time.txt \
                  amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_holdouts/*.json
          if ! git diff --cached --quiet; then
            git commit -m "results: archive q25 cross-morphology preflight mappings"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve exact SWC bytes and preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prima-q25-cross-morphology-boundary-preflight
          path: |
            amsn-core/data/human/allen_cell_types/770307286_transformed.CNG.swc
            amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_report.json
            amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_mapping.csv
            amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25.time.txt
            amsn-core/results/prima_q25_cross_morphology_boundary_preflight_2026-11-25_holdouts/*.json
          if-no-files-found: error
          retention-days: 90
