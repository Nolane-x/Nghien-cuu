name: AMSN Segev Full-Tree Axial Conductance Matrix Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/amsn-segev-full-tree-axial-matrix-audit.yml"
      - "amsn-core/examples/human_full_tree_axial_matrix_audit.py"
      - "amsn-core/examples/human_full_tree_axial_network_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/morphology.py"
      - "amsn-core/src/amsn/sectioned.py"
      - "amsn-core/data/human/segev/**"
      - "amsn-core/pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/amsn-segev-full-tree-axial-matrix-audit.yml"
      - "amsn-core/examples/human_full_tree_axial_matrix_audit.py"
      - "amsn-core/examples/human_full_tree_axial_network_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/src/amsn/morphology.py"
      - "amsn-core/src/amsn/sectioned.py"
      - "amsn-core/data/human/segev/**"
      - "amsn-core/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axial-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - morphology_label: NMO_68174_cell1125
            morphology_path: data/human/segev/2013_03_06_cell11_1125_H41_06.CNG.swc
          - morphology_label: NMO_68175_cell1204
            morphology_path: data/human/segev/2013_03_13_cell03_1204_H42_02.CNG.swc
    env:
      AMSN_MORPHOLOGY_LABEL: ${{ matrix.morphology_label }}
      AMSN_MORPHOLOGY_PATH: ${{ matrix.morphology_path }}
      AMSN_NEURON_MAX_SEGMENT_UM: "0.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON reference simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Run complete AMSN test suite
        run: python -m pytest
        working-directory: amsn-core
      - name: Verify NEURON and morphology fixture
        run: |
          python -c "import neuron; print('NEURON', neuron.__version__)"
          test -s "${{ matrix.morphology_path }}"
        working-directory: amsn-core
      - name: Run full-tree axial conductance matrix audit
        shell: bash
        run: |
          set -o pipefail
          python examples/human_full_tree_axial_matrix_audit.py | tee "${{ matrix.morphology_label }}-full-tree-axial-matrix.log"
        working-directory: amsn-core
      - name: Preserve conductance matrix audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-${{ matrix.morphology_label }}-full-tree-axial-matrix
          path: |
            amsn-core/${{ matrix.morphology_label }}-full-tree-axial-matrix.log
            amsn-core/results/${{ matrix.morphology_label }}_human_full_tree_axial_matrix_edges_2026-11-21.csv
            amsn-core/results/${{ matrix.morphology_label }}_human_full_tree_axial_matrix_probes_2026-11-21.csv
          if-no-files-found: error
