name: AMSN Segev human L2/3 fine-mesh passive impedance refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/amsn-segev-fine-mesh-frequency-audit.yml"
      - "amsn-core/data/human/segev/**"
      - "amsn-core/src/amsn/**"
      - "amsn-core/tests/test_segev_reference_morphologies.py"
      - "amsn-core/tests/test_human_morphology.py"
      - "amsn-core/examples/human_passive_frequency_response_audit.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/amsn-segev-fine-mesh-frequency-audit.yml"
      - "amsn-core/data/human/segev/**"
      - "amsn-core/src/amsn/**"
      - "amsn-core/tests/test_segev_reference_morphologies.py"
      - "amsn-core/tests/test_human_morphology.py"
      - "amsn-core/examples/human_passive_frequency_response_audit.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segev-frequency-fine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - morphology_label: NMO_68174_cell1125
            morphology_path: data/human/segev/2013_03_06_cell11_1125_H41_06.CNG.swc
          - morphology_label: NMO_68175_cell1204
            morphology_path: data/human/segev/2013_03_13_cell03_1204_H42_02.CNG.swc
    env:
      AMSN_MORPHOLOGY_LABEL: ${{ matrix.morphology_label }}
      AMSN_MORPHOLOGY_PATH: ${{ matrix.morphology_path }}
      AMSN_NEURON_MAX_SEGMENT_UM: "0.0625"
      AMSN_FREQUENCY_OUTPUT: ${{ matrix.morphology_label }}-passive-frequency-0.0625um.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Run complete AMSN test suite
        run: python -m pytest
        working-directory: amsn-core
      - name: Verify morphology input
        run: |
          python -c "import neuron; print('NEURON', neuron.__version__)"
          test -s "${{ matrix.morphology_path }}"
        working-directory: amsn-core
      - name: Run 0.0625 um passive complex impedance comparison
        run: python examples/human_passive_frequency_response_audit.py
        working-directory: amsn-core
      - name: Upload raw fine-mesh impedance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-${{ matrix.morphology_label }}-mesh-0.0625um
          path: amsn-core/${{ matrix.morphology_label }}-passive-frequency-0.0625um.csv
          if-no-files-found: ignore
