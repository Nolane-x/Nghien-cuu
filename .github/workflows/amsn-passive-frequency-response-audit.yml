name: AMSN Passive Frequency-Domain Impedance Audit

on:
  push:
    branches: [main]
    paths:
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/tests/test_cable.py"
      - "amsn-core/examples/human_passive_frequency_response_audit.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-passive-frequency-response-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "amsn-core/src/amsn/cable.py"
      - "amsn-core/tests/test_cable.py"
      - "amsn-core/examples/human_passive_frequency_response_audit.py"
      - "amsn-core/examples/human_fine_mesh_passive_dc_audit.py"
      - "amsn-core/examples/neuron_cross_validation.py"
      - "amsn-core/data/human/**"
      - "amsn-core/pyproject.toml"
      - ".github/workflows/amsn-passive-frequency-response-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frequency-response:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        neuron_mesh_um: ["0.5", "0.25", "0.125"]
    env:
      AMSN_NEURON_MAX_SEGMENT_UM: ${{ matrix.neuron_mesh_um }}
      AMSN_FREQUENCY_OUTPUT: human-passive-frequency-response-${{ matrix.neuron_mesh_um }}um.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml
      - name: Install AMSN and pinned NEURON
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --only-binary=neuron "neuron==9.0.2"
        working-directory: amsn-core
      - name: Run complete AMSN core tests
        run: python -m pytest
        working-directory: amsn-core
      - name: Verify NEURON and morphology fixture
        run: |
          python -c "import neuron; print('NEURON', neuron.__version__)"
          test -s data/human/1094_Mohan_etal_2015.CNG.swc
        working-directory: amsn-core
      - name: Run passive frequency-domain comparison
        run: python examples/human_passive_frequency_response_audit.py
        working-directory: amsn-core
      - name: Preserve raw frequency-response measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsn-passive-frequency-response-${{ matrix.neuron_mesh_um }}um
          path: amsn-core/human-passive-frequency-response-${{ matrix.neuron_mesh_um }}um.csv
          if-no-files-found: ignore
