name: Import preserved AMSN core archive

on:
  push:
    branches: [main]
    paths:
      - "archives/AMSN_Neuron_Core_v0.1.0.tar.xz"

permissions:
  contents: write

concurrency:
  group: amsn-core-archive-import
  cancel-in-progress: false

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Extract and validate archive paths
        shell: bash
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}:archives/AMSN_Neuron_Core_v0.1.0.tar.xz" > /tmp/amsn-core.tar.xz
          if tar -tJf /tmp/amsn-core.tar.xz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path detected"
            exit 1
          fi
          mkdir -p /tmp/amsn-core-restore
          tar -xJf /tmp/amsn-core.tar.xz -C /tmp/amsn-core-restore
          test -f /tmp/amsn-core-restore/amsn-core/pyproject.toml
          test -f /tmp/amsn-core-restore/amsn-core/src/amsn/morphology.py
          test -f /tmp/amsn-core-restore/amsn-core/tests/test_cable.py
          while IFS= read -r -d '' file; do
            relative="${file#/tmp/amsn-core-restore/}"
            if [[ -e "$relative" && "$relative" != "README.md" ]]; then
              echo "Refusing to overwrite existing path: $relative"
              exit 1
            fi
          done < <(find /tmp/amsn-core-restore -type f -print0)
          cp -a /tmp/amsn-core-restore/. .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: amsn-core/pyproject.toml

      - name: Install and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m compileall -q src tests examples
          python examples/inspect_swc.py
          python examples/passive_tree.py
          python examples/scaling_smoke.py
        working-directory: amsn-core

      - name: Commit restored source and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md HANDOFF_2026-11-20_AMSN-CORE.md amsn-core .github/workflows/amsn-core.yml research/HUMAN_L23_EVIDENCE_UPDATE_2026-11-20.md research/RESEARCH_LOG_2026-11-20_AMSN-CORE.md research/SWC_TO_CABLE_DISCRETIZATION_2026-11-20.md
          git commit -m "feat: add tested AMSN neuron core v0.1.0"
          git push origin HEAD:main
